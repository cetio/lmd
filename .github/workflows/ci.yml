name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        compiler: [ dmd-latest, ldc-latest ]
        exclude:
          - os: macos-latest
            compiler: dmd-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install D compiler (${{ matrix.compiler }})
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Run tests
        run: dub test
